[workspace]
resolver = "3"
members = ["cat", "chmod", "cp", "echo", "ln", "ls", "mkdir", "mv", "rm", "rmdir", "touch"]

[profile]

[profile.release]
codegen-units = 1
debug = 1
incremental = false
lto = "fat"
opt-level = "s"
overflow-checks = true
panic = "abort"
strip = "none"
